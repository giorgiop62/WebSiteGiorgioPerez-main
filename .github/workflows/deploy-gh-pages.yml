name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: 'Diagnostics: node/npm/git'
        run: |
          node -v
          npm -v
          git --version
          pwd
          ls -la
      - name: Install dependencies (ci)
        run: |
          npm ci --prefer-offline --no-audit --progress=false
      - name: Show disk usage and node_modules size
        run: |
          du -sh . || true
          du -sh node_modules || true
      - name: Build
        run: npm run build
      - name: Add CNAME for custom domain
        run: echo 'www.ermesmedia.com' > ./dist/CNAME
      - name: SPA fallback for direct links (e.g. /cookie-policy)
        run: cp ./dist/index.html ./dist/404.html
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
